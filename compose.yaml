services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONFIG_FILE: ${CONFIG_FILE:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_BACKEND: ${DATABASE_BACKEND:-sqlite}
      DATABASE_SQLITE_PATH: /app/data/ashare_journal.db
      FRONTEND_DIST_DIR: /app/static
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ashare_ledger}
      MYSQL_USER: ${MYSQL_USER:-ashare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ashare_dev_password}
      QUOTE_PROVIDER: ${QUOTE_PROVIDER:-eastmoney}
      QUOTE_TIMEOUT_SECONDS: ${QUOTE_TIMEOUT_SECONDS:-5}
      LONGBRIDGE_APP_KEY: ${LONGBRIDGE_APP_KEY:-}
      LONGBRIDGE_APP_SECRET: ${LONGBRIDGE_APP_SECRET:-}
      LONGBRIDGE_ACCESS_TOKEN: ${LONGBRIDGE_ACCESS_TOKEN:-}
      LONGBRIDGE_ENABLE_OVERNIGHT: ${LONGBRIDGE_ENABLE_OVERNIGHT:-false}
      LONGBRIDGE_HTTP_URL: ${LONGBRIDGE_HTTP_URL:-}
      LONGBRIDGE_QUOTE_WS_URL: ${LONGBRIDGE_QUOTE_WS_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-wing_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    ports:
      - "${APP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  mysql:
    image: mysql:8.4
    profiles:
      - mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ashare_ledger}
      MYSQL_USER: ${MYSQL_USER:-ashare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ashare_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ashare_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
